services:
  - type: web
    name: real-talk
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # LLM provider (llmod.ai)
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        sync: false
      - key: LLM_REQUEST_DELAY
        value: "0.2"

      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_PASSWORD
        sync: false

      # Pinecone
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_HOST
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: PINECONE_ENV
        sync: false

      # RAG
      - key: EMBEDDING_DIMENSION
        value: "512"
